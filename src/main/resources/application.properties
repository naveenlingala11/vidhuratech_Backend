spring.application.name=jobs
spring.threads.virtual.enabled=true

# PROFILE
spring.profiles.active=dev

# LOGGING
logging.level.org.springframework.mail=DEBUG
logging.level.jakarta.mail=DEBUG
logging.level.org.apache.tomcat.util.http.parser.Cookie=WARN

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# PAGINATION
spring.data.web.pageable.default-page-size=15
spring.data.web.pageable.max-page-size=50

# THREADS
spring.task.execution.pool.core-size=6
spring.task.execution.pool.max-size=12

# CRON
scraper.cron.periodic=0 0 9,15,21 * * *

# ADZUNA SCRAPER SCHEDULER DEFAULTS
adzuna.default-pages=${ADZUNA_DEFAULT_PAGES:2}
adzuna.crawl-roles=${ADZUNA_CRAWL_ROLES:Software Developer,Java Developer,Frontend Developer,Python Developer,React Developer,Full Stack Developer,DevOps Engineer,Data Analyst,QA Engineer,Android Developer}

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# FILE UPLOAD
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# MAIL (ENV BASED)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# PAYMENT
payment.upi-id=${PAYMENT_UPI_ID}
payment.merchant-name=Vidhura Tech

# REDIS
spring.data.redis.url=${REDIS_URL}
spring.data.redis.repositories.enabled=false

# FRONTEND
app.frontend-url=${FRONTEND_URL}

ZOHO_CLIENT_ID=1000.BUUF5EKPQ0UHGS9VWLWFU7H2CKM7NQ
ZOHO_CLIENT_SECRET=c6d2818a637880e839e5f423ddf62fd863faf90bcd

#ONLINECOMPILER
onlinecompiler.base-url=https://judge0-ce.p.rapidapi.com

# ADZUNA API (Live Indian Jobs Aggregator)
adzuna.app-id=${ADZUNA_APP_ID}
adzuna.app-key=${ADZUNA_APP_KEY}

# TIMEZONE
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

app.oauth.google-client-id=${GOOGLE_CLIENT_ID:}
app.oauth.github-client-id=${GITHUB_CLIENT_ID:}
app.oauth.github-client-secret=${GITHUB_CLIENT_SECRET:}

# GEMINI AI
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# GROQ AI
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-specdec}

# DEEPSEEK AI
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}

# OPENROUTER AI
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:meta-llama/llama-3-8b-instruct:free}

# ACTIVE AI PROVIDER (GEMINI, GROQ, DEEPSEEK, or OPENROUTER)
ai.active-provider=${AI_ACTIVE_PROVIDER:GEMINI}
