# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.data-source-properties.sslmode=require

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SERVER
server.port=${PORT:8080}

# LOGGING
logging.level.root=WARN
logging.level.com.vidhuratech=INFO

# REDIS
spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true

# FRONTEND
FRONTEND_URL=${FRONTEND_URL}

# MAIL
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# JWT
JWT_SECRET=${JWT_SECRET}

# PAYMENT
PAYMENT_UPI_ID=${PAYMENT_UPI_ID}

# RAZORPAY
RAZORPAY_KEY_ID=${RAZORPAY_KEY}
RAZORPAY_KEY_SECRET=${RAZORPAY_SECRET}
RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}

#ONLINE COMPILER
onlinecompiler.api-key=${ONLINECOMPILER_API_KEY}

app.upload-dir=/app/uploads

# S3 STORAGE FOR IMAGES IN DIGITAL OCEAN
do.spaces.key=${DO_SPACES_KEY}
do.spaces.secret=${DO_SPACES_SECRET}
do.spaces.region=${DO_SPACES_REGION:nyc3}
do.spaces.bucket=${DO_SPACES_BUCKET:vidhura-tech-assets}
do.spaces.endpoint=${DO_SPACES_ENDPOINT:https://nyc3.digitaloceanspaces.com}
do.spaces.public-url=${DO_SPACES_PUBLIC_URL:https://vidhura-tech-assets.nyc3.digitaloceanspaces.com}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
management.health.redis.enabled=false
management.endpoint.health.show-details=never

# TIMEZONE
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata